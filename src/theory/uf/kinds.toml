# kinds.toml
#
# For documentation on this file format, please refer to
# src/theory/builtin/kinds.toml.
#

[theory]
id                 = "THEORY_UF"
base_class         = "::ava6::internal::theory::uf::TheoryUF"
base_class_header  = "theory/uf/theory_uf.h"
properties         = ["stable-infinite", "parametric", "check", "ppStaticLearn", "presolve"]
typechecker_header = "theory/uf/theory_uf_type_rules.h"

[rewriter]
class  = "::ava6::internal::theory::uf::TheoryUfRewriter"
header = "theory/uf/theory_uf_rewriter.h"

[[kinds]]
type     = "parameterized"
K1       = "APPLY_UF"
K2       = "VARIABLE"
children = "1:"
comment  = "application of an uninterpreted function; first parameter is the function, remaining ones are parameters to that function"
typerule = "::ava6::internal::theory::uf::UfTypeRule"

[[kinds]]
type     = "operator"
name     = "FUNCTION_TYPE"
children = "2:"
comment  = "a function type"
[kinds.cardinality]
computer = "::ava6::internal::theory::uf::FunctionProperties::computeCardinality(%TYPE%)"
header   = "theory/uf/theory_uf_type_rules.h"
[kinds.well-founded]
wellfoundedness-computer = "::ava6::internal::theory::uf::FunctionProperties::isWellFounded(%TYPE%)"
ground-term-computer     = "::ava6::internal::theory::uf::FunctionProperties::mkGroundTerm(%TYPE%)"
header                   = "theory/uf/theory_uf_type_rules.h"
[kinds.enumerator]
class  = "::ava6::internal::theory::uf::FunctionEnumerator"
header = "theory/uf/type_enumerator.h"

[[kinds]]
type     = "operator"
name     = "LAMBDA"
children = 2
comment  = "a lambda expression; first parameter is a BOUND_VAR_LIST, second is lambda body"
typerule = "::ava6::internal::theory::uf::LambdaTypeRule"

[[kinds]]
type     = "operator"
name     = "HO_APPLY"
children = 2
comment  = "higher-order (partial) function application"
typerule = "::ava6::internal::theory::uf::HoApplyTypeRule"

[[kinds]]
type      = "constant"
name      = "FUNCTION_ARRAY_CONST"
class_key = "class"
cpp_type  = "FunctionArrayConst"
hasher    = "::ava6::internal::FunctionArrayConstHashFunction"
header    = "expr/function_array_const.h"
comment   = "the function constant; payload is an instance of the ava6::internal::FunctionArrayConst class"
typerule  = "::ava6::internal::theory::uf::FunctionArrayConstTypeRule"

## conversion kinds
[[kinds]]
type     = "operator"
name     = "BITVECTOR_UBV_TO_INT"
children = 1
comment  = "bit-vector conversion to integer; parameter is treated as an unsigned bit-vector"
typerule = "::ava6::internal::theory::uf::BitVectorConversionTypeRule"

[[kinds]]
type     = "operator"
name     = "BITVECTOR_SBV_TO_INT"
children = 1
comment  = "bit-vector conversion to integer; parameter is treated as a signed bit-vector"
typerule = "::ava6::internal::theory::uf::BitVectorConversionTypeRule"

[[kinds]]
type      = "constant"
name      = "INT_TO_BITVECTOR_OP"
class_key = "struct"
cpp_type  = "IntToBitVector"
hasher    = "::ava6::internal::UnsignedHashFunction< ::ava6::internal::IntToBitVector >"
header    = "util/bitvector.h"
comment   = "operator for the integer conversion to bit-vector; payload is an instance of the ava6::internal::IntToBitVector class"
typerule  = "::ava6::internal::theory::uf::IntToBitVectorOpTypeRule"

[[kinds]]
type     = "parameterized"
K1       = "INT_TO_BITVECTOR"
K2       = "INT_TO_BITVECTOR_OP"
children = 1
comment  = "integer conversion to bit-vector; first parameter is an INT_TO_BITVECTOR_OP, second is an integer term"
typerule = "::ava6::internal::theory::uf::BitVectorConversionTypeRule"

[[kinds]]
type     = "operator"
name     = "DISTINCT"
children = "2:"
comment  = "disequality (N-ary, sorts must match)"
typerule = "::ava6::internal::theory::uf::DistinctTypeRule"
