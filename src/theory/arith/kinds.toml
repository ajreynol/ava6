# kinds.toml
#
# For documentation on this file format, please refer to
# src/theory/builtin/kinds.toml.
#

[theory]
id                 = "THEORY_ARITH"
base_class         = "::ava6::internal::theory::arith::TheoryArith"
base_class_header  = "theory/arith/theory_arith.h"
properties         = ["stable-infinite", "check", "propagate", "ppStaticLearn", "presolve", "notifyRestart"]
typechecker_header = "theory/arith/theory_arith_type_rules.h"

[rewriter]
class  = "::ava6::internal::theory::arith::ArithRewriter"
header = "theory/arith/arith_rewriter.h"

[[kinds]]
type     = "operator"
name     = "ADD"
children = "2:"
comment  = "arithmetic addition (N-ary)"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule" 

[[kinds]]
type     = "operator"
name     = "MULT"
children = "2:"
comment  = "arithmetic multiplication (N-ary)"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule"

[[kinds]]
type     = "operator"
name     = "NONLINEAR_MULT"
children = "2:"
comment  = "synonym for MULT"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule"

[[kinds]]
type     = "operator"
name     = "SUB"
children = 2
comment  = "arithmetic binary subtraction operator"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule"

[[kinds]]
type     = "operator"
name     = "NEG"
children = 1
comment  = "arithmetic unary negation"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule" 

[[kinds]]
type     = "operator"
name     = "DIVISION"
children = 2
comment  = "real division, division by 0 undefined (user symbol)"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule" 

[[kinds]]
type     = "operator"
name     = "DIVISION_TOTAL"
children = 2
comment  = "real division with interpreted division by 0 (internal symbol)"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule" 

[[kinds]]
type     = "operator"
name     = "INTS_DIVISION"
children = 2
comment  = "integer division, division by 0 undefined (user symbol)"
typerule = "SimpleTypeRule<RInteger, AInteger, AInteger>"

[[kinds]]
type     = "operator"
name     = "INTS_DIVISION_TOTAL"
children = 2
comment  = "integer division with interpreted division by 0 (internal symbol)"
typerule = "SimpleTypeRule<RInteger, AInteger, AInteger>"

[[kinds]]
type     = "operator"
name     = "INTS_MODULUS"
children = 2
comment  = "integer modulus, division by 0 undefined (user symbol)"
typerule = "SimpleTypeRule<RInteger, AInteger, AInteger>"

[[kinds]]
type     = "operator"
name     = "INTS_MODULUS_TOTAL"
children = 2
comment  = "integer modulus with interpreted division by 0 (internal symbol)"
typerule = "SimpleTypeRule<RInteger, AInteger, AInteger>"

[[kinds]]
type     = "operator"
name     = "ABS"
children = 1
comment  = "absolute value"
typerule = "::ava6::internal::theory::arith::ArithOperatorTypeRule"

[[kinds]]
type     = "parameterized"
K1       = "DIVISIBLE"
K2       = "DIVISIBLE_OP" 
children = 1
comment  = "divisibility-by-k predicate; first parameter is a DIVISIBLE_OP, second is integer term"
typerule = "SimpleTypeRule<RBool, AInteger>"

[[kinds]]
type     = "operator"
name     = "POW"
children = 2
comment  = "arithmetic power"
typerule = "::ava6::internal::theory::arith::PowTypeRule"

[[kinds]]
type     = "operator"
name     = "POW2"
children = 1
comment  = "arithmetic power of 2"
typerule = "SimpleTypeRule<RInteger, AInteger>" 

[[kinds]]
type     = "operator"
name     = "INTS_ISPOW2"
children = 1
comment  = "test if an integer is a power of 2"
typerule = "SimpleTypeRule<RBool, AInteger>" 

[[kinds]]
type     = "operator"
name     = "INTS_LOG2"
children = 1
comment  = "integer logarithm base 2 (round down to power of 2)"
typerule = "SimpleTypeRule<RInteger, AInteger>"

[[kinds]]
type      = "constant"
name      = "DIVISIBLE_OP" 
class_key = "struct"
cpp_type  = "Divisible"
hasher    = "::ava6::internal::DivisibleHashFunction"
header    = "util/divisible.h"
comment   = "operator for the divisibility-by-k predicate; payload is an instance of the ava6::internal::Divisible class"
typerule  = "SimpleTypeRule<RBuiltinOperator>" 

[[kinds]]
type          = "sort"
name          = "REAL_TYPE"
cardinality   = "Cardinality::REALS"
well_founded  = true
ground-term   = "nm->mkConstReal(Rational(0))"
header        = "expr/node_manager.h"
comment       = "real type"
[kinds.enumerator]
class  = "::ava6::internal::theory::arith::RationalEnumerator"
header = "theory/arith/type_enumerator.h"

[[kinds]]
type          = "sort"
name          = "INTEGER_TYPE"
cardinality   = "Cardinality::INTEGERS"
well_founded  = true
ground-term   = "nm->mkConstInt(Rational(0))"
header        = "expr/node_manager.h"
comment       = "integer type"
[kinds.enumerator]
class  = "::ava6::internal::theory::arith::IntegerEnumerator"
header = "theory/arith/type_enumerator.h"

[[kinds]]
type      = "constant"
name      = "CONST_RATIONAL"
class_key = "class"
cpp_type  = "Rational+"
hasher    = "::ava6::internal::RationalHashFunction"
header    = "util/rational.h"
comment   = "a multiple-precision rational constant; payload is an instance of the ava6::internal::Rational class"
typerule  = "::ava6::internal::theory::arith::ArithConstantTypeRule" 

[[kinds]]
type      = "constant"
name      = "CONST_INTEGER"
class_key = "class"
cpp_type  = "Rational+"
hasher    = "::ava6::internal::RationalHashFunction"
header    = "util/rational.h"
comment   = "a multiple-precision integer constant; payload is an instance of the ava6::internal::Rational class"
typerule  = "::ava6::internal::theory::arith::ArithConstantTypeRule"

[[kinds]]
type = "operator"
name     = "LT"
children = 2
comment  = "less than, x < y"
typerule = "::ava6::internal::theory::arith::ArithRelationTypeRule" 

[[kinds]]
type     = "operator"
name     = "LEQ"
children = 2
comment  = "less than or equal, x <= y"
typerule = "::ava6::internal::theory::arith::ArithRelationTypeRule"

[[kinds]]
type     = "operator"
name     = "GT"
children = 2
comment  = "greater than, x > y"
typerule = "::ava6::internal::theory::arith::ArithRelationTypeRule" 

[[kinds]]
type     = "operator"
name     = "GEQ"
children = 2
comment  = "greater than or equal, x >= y"
typerule = "::ava6::internal::theory::arith::ArithRelationTypeRule" 

[[kinds]]
type     = "operator"
name     = "IS_INTEGER"
children = 1
comment  = "term-is-integer predicate (parameter is a real-sorted term)"
typerule = "SimpleTypeRule<RBool, ARealOrInteger>" 

[[kinds]]
type = "operator"
name     = "TO_INTEGER"
children = 1
comment  = "convert term to integer by the floor function (parameter is a real-sorted term)"
typerule = "SimpleTypeRule<RInteger, ARealOrInteger>"

[[kinds]]
type     = "operator"
name     = "TO_REAL"
children = 1
comment  = "cast term to real (parameter is an integer-sorted term)"
typerule = "SimpleTypeRule<RReal, ARealOrInteger>"
